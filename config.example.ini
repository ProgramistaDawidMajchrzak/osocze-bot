; Skopiuj ten plik jako config.ini i uzupełnij dane.

[smtp]
; Gmail: host = smtp.gmail.com, port = 465, hasło = "hasło do aplikacji"
; (Konto Google -> Bezpieczeństwo -> Weryfikacja dwuetapowa -> Hasła do aplikacji)
host = smtp.gmail.com
port = 465
user = twoj.adres@gmail.com
password = xxxx xxxx xxxx xxxx
from = twoj.adres@gmail.com
; kilku odbiorców oddziel przecinkami
to = jan@example.com

[bot]
; co ile sekund sprawdzać (zalecane 60–120)
interval_seconds = 90
